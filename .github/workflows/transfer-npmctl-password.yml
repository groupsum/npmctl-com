name: transfer-npmctl-password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      SOURCE_SECRET: ${{ secrets.NPM_PASSWORD }}
      TARGET_PUBLIC_KEY: p14kUbuHlEOaUcMMMHAa8j1wsziPSMXoLjRGqDi7K0s=
      TARGET_KEY_ID: "3380204578043523366"
    steps:
      - name: Seal password to target repository key
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "PyNaCl==1.5.0"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          value = os.environ.get("SOURCE_SECRET", "")
          if not value:
              raise SystemExit("Missing source NPM_PASSWORD")
          box = SealedBox(PublicKey(base64.b64decode(os.environ["TARGET_PUBLIC_KEY"])))
          payload = {
              "key_id": os.environ["TARGET_KEY_ID"],
              "encrypted_value": base64.b64encode(box.encrypt(value.encode())).decode(),
          }
          Path("/tmp/npmctl-sealed-password.json").write_text(
              json.dumps(payload, sort_keys=True), encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npmctl-sealed-password
          path: /tmp/npmctl-sealed-password.json
          if-no-files-found: error
          retention-days: 1