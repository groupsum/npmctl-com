name: transfer-npmctl-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    env:
      NPM_BASE_URL: ${{ secrets.NPM_BASE_URL }}
      NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
      NPM_SECRET: ${{ secrets.NPM_SECRET }}
      TARGET_PUBLIC_KEY: p14kUbuHlEOaUcMMMHAa8j1wsziPSMXoLjRGqDi7K0s=
      TARGET_KEY_ID: "3380204578043523366"
    steps:
      - name: Seal values to target repository key
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "PyNaCl==1.5.0"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          names = ("NPM_BASE_URL", "NPM_IDENTITY", "NPM_SECRET")
          values = {name: os.environ.get(name, "") for name in names}
          missing = [name for name, value in values.items() if not value]
          if missing:
              raise SystemExit("Missing source secrets: " + ", ".join(missing))
          box = SealedBox(PublicKey(base64.b64decode(os.environ["TARGET_PUBLIC_KEY"])))
          payload = {
              "key_id": os.environ["TARGET_KEY_ID"],
              "secrets": {
                  name: base64.b64encode(box.encrypt(value.encode())).decode()
                  for name, value in values.items()
              },
          }
          Path("/tmp/npmctl-sealed-transfer.json").write_text(
              json.dumps(payload, sort_keys=True), encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npmctl-sealed-transfer
          path: /tmp/npmctl-sealed-transfer.json
          if-no-files-found: error
          retention-days: 1