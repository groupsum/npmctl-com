---
apiVersion: npmctl.com/v1
schemaVersion: 2
dns_records:
  - provider: namecheap
    zone: npmctl.com
    type: A
    name: "@"
    value: __SITE_SERVER_IP__
    ttl: 300
    meta:
      managed_by: npmctl
      owner: npmctl-com
      resource_id: dns.npmctl-com.root-a
  - provider: namecheap
    zone: npmctl.com
    type: A
    name: "*.npmctl.com"
    value: __SITE_SERVER_IP__
    ttl: 300
    meta:
      managed_by: npmctl
      owner: npmctl-com
      resource_id: dns.npmctl-com.wildcard-a
  - provider: namecheap
    zone: npmctl.com
    type: CNAME
    name: "www"
    value: npmctl.com
    ttl: 300
    meta:
      managed_by: npmctl
      owner: npmctl-com
      resource_id: dns.npmctl-com.www-cname
