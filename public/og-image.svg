<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <!-- Rich gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Glowing subtle backgrounds -->
  <circle cx="950" cy="150" r="250" fill="#10b981" opacity="0.1" filter="url(#glow)"/>
  <circle cx="200" cy="480" r="200" fill="#2dd4bf" opacity="0.05" filter="url(#glow)"/>

  <!-- Tech grid background -->
  <g opacity="0.1">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500" stroke="#475569" stroke-width="1"/>
    <path d="M 200,0 L 200,630 M 400,0 L 400,630 M 600,0 L 600,630 M 800,0 L 800,630 M 1000,0 L 1000,630" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Left Side: Typography and Info -->
  <g transform="translate(100, 150)">
    <!-- Brand Badge -->
    <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="70" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1.5" text-anchor="middle">PyPI STABLE</text>
    
    <!-- Title -->
    <text x="0" y="110" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="-1">npmctl</text>
    
    <!-- Subtitle -->
    <text x="0" y="170" font-family="'Inter', sans-serif" font-size="28" font-weight="600" fill="url(#brand-grad)">GitOps for Nginx Proxy Manager</text>
    
    <!-- Description paragraphs -->
    <text x="0" y="230" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Declare proxy, certificate, and DNS state in YAML. Validate schema,
    </text>
    <text x="0" y="260" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      review owner-scoped changes, and apply safe reconciles without UI errors.
    </text>

    <!-- CLI command sample pill -->
    <g transform="translate(0, 310)">
      <rect width="360" height="54" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
      <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="15" fill="#10b981" font-weight="bold">$</text>
      <text x="44" y="32" font-family="'JetBrains Mono', monospace" font-size="15" fill="#e2e8f0">pipx install npmctl &amp;&amp; npmctl plan</text>
    </g>
  </g>

  <!-- Right Side: Flow Visualization / Schematic -->
  <g transform="translate(740, 140)">
    <!-- YAML File box -->
    <g transform="translate(40, 40)">
      <rect width="180" height="200" rx="12" fill="#0b1329" stroke="#1e293b" stroke-width="2"/>
      <path d="M 40,0 L 140,0 L 180,40 L 180,200 L 0,200 L 0,40 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <!-- File line lines -->
      <line x1="30" y1="50" x2="100" y2="50" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
      <line x1="30" y1="80" x2="150" y2="80" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="110" x2="130" y2="110" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="135" x2="140" y2="135" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="160" x2="110" y2="160" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <!-- Small label -->
      <text x="90" y="235" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">desired-state.yaml</text>
    </g>

    <!-- Arrow Flow -->
    <g transform="translate(260, 140)">
      <path d="M 0,0 L 50,0 M 40,-10 L 50,0 L 40,10" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Gear Controller -->
    <g transform="translate(320, 100)">
      <circle cx="60" cy="60" r="50" fill="#020617" stroke="#10b981" stroke-width="3"/>
      <!-- Gear Teeth -->
      <path d="M 60,0 L 60,120 M 0,60 L 120,60 M 18,18 L 102,102 M 18,102 L 102,18" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
      <circle cx="60" cy="60" r="35" fill="#090d16" stroke="#34d399" stroke-width="3"/>
      <!-- Center -->
      <circle cx="60" cy="60" r="15" fill="#10b981"/>
      <text x="60" y="145" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">npmctl engine</text>
    </g>
  </g>
  
  <!-- Footer subtle logo/org -->
  <text x="100" y="550" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#475569">Open source under Apache-2.0 License • GitHub: github.com/groupsum/npmctl</text>
</svg>
