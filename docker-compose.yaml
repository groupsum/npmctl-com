services:
  npmctl-com:
    build: .
    container_name: npmctl-com
    restart: unless-stopped
    labels:
      site.host: npmctl.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      npmctl-com-private: {}
      portwyrm-edge:
        aliases:
          - npmctl-com

networks:
  npmctl-com-private:
    name: npmctl-com-private
    internal: true
  portwyrm-edge:
    name: portwyrm-edge
    external: true
