services:
  npmctl-com:
    build: .
    container_name: npmctl-com
    restart: unless-stopped
    labels:
      site.host: npmctl.com
      site.kind: mdwrk-lander
    expose:
      - "80"
    networks:
      dockerwp:
        aliases:
          - npmctl-com

networks:
  dockerwp:
    name: dockerwp
    external: true
